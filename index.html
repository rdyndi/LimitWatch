    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#8B5CF6', // Violet-500
              secondary: '#EC4899', // Pink-500
              glass: {
                100: 'rgba(255, 255, 255, 0.1)',
                200: 'rgba(255, 255, 255, 0.2)',
                300: 'rgba(255, 255, 255, 0.3)',
                400: 'rgba(255, 255, 255, 0.4)',
                500: 'rgba(255, 255, 255, 0.5)',
              },
              danger: '#FF3B30',
              success: '#34C759',
              warning: '#FFCC00',
            },
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
              'glow': '0 0 20px rgba(139, 92, 246, 0.3)',
            }
          }
        }
      }
    </script>

    <!-- Font Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      html, body {
        overscroll-behavior-y: none;
        height: 100%;
        width: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Liquid Aurora Background - Premium Purple/Pink Gradient */
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #c4b5fd 0%, #e879f9 50%, #818cf8 100%);
        background-size: 200% 200%;
        animation: gradientBG 15s ease infinite;
        color: #1e293b;
      }

      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Animated Mesh Background - Softer, Lighter */
      .ambient-light {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        background: radial-gradient(circle at top left, #f3e8ff, transparent),
                    radial-gradient(circle at bottom right, #fce7f3, transparent);
        overflow: hidden;
      }
      
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.5;
        animation: float 20s infinite ease-in-out alternate;
        will-change: transform;
      }

      /* Orb colors adjusted for Purple/Pink/Blue theme */
      .orb-1 {
        width: 80vw;
        height: 80vw;
        background: radial-gradient(circle, rgba(167, 139, 250, 0.6) 0%, rgba(167, 139, 250, 0) 70%); /* Violet */
        top: -20%;
        left: -20%;
        animation-duration: 25s;
      }
      
      .orb-2 {
        width: 90vw;
        height: 90vw;
        background: radial-gradient(circle, rgba(244, 114, 182, 0.6) 0%, rgba(244, 114, 182, 0) 70%); /* Pink */
        bottom: -20%;
        right: -20%;
        animation-duration: 30s;
        animation-delay: -5s;
      }

      .orb-3 {
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(129, 140, 248, 0.5) 0%, rgba(129, 140, 248, 0) 70%); /* Indigo */
        top: 40%;
        left: 30%;
        animation-duration: 20s;
        animation-delay: -10s;
      }

      .orb-4 {
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(216, 180, 254, 0.5) 0%, rgba(216, 180, 254, 0) 70%); /* Lavender */
        bottom: 10%;
        left: 10%;
        animation-duration: 28s;
        animation-delay: -15s;
      }

      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); }
        33% { transform: translate(30px, -50px) rotate(10deg) scale(1.1); }
        66% { transform: translate(-20px, 20px) rotate(-5deg) scale(0.95); }
        100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      }

      /* --- Liquid Glass Utilities --- */

      /* Premium Glass Panel */
      .glass-panel {
        background: rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(24px) saturate(150%);
        -webkit-backdrop-filter: blur(24px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
      }
      
      /* Glass Box for Icons */
      .glass-box {
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      }

      /* Darker/Heavy Glass (for Sidebars/Navs) */
      .glass-heavy {
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border-right: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.02);
      }
      
      /* Mobile Nav Glass */
      .glass-nav {
         background: rgba(255, 255, 255, 0.6);
         backdrop-filter: blur(30px) saturate(180%);
         -webkit-backdrop-filter: blur(30px) saturate(180%);
         border-top: 1px solid rgba(255, 255, 255, 0.4);
         box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.02);
      }

      /* Input Fields Glass */
      .glass-input {
        background: rgba(255, 255, 255, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        color: #1e293b;
      }
      .glass-input:focus {
        background: rgba(255, 255, 255, 0.7);
        border-color: #8b5cf6;
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        transform: translateY(-1px);
      }
      .glass-input::placeholder {
        color: rgba(100, 116, 139, 0.6);
      }

      /* Modal Overlay */
      .glass-overlay {
        background: rgba(76, 29, 149, 0.15); /* Deep purple tint */
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* Buttons with liquid sheen */
      .btn-liquid {
        background-image: linear-gradient(135deg, #8B5CF6 0%, #D946EF 100%);
        box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3), inset 0 1px 0 rgba(255,255,255,0.3);
        border: 1px solid rgba(255,255,255,0.2);
        position: relative;
        overflow: hidden;
      }
      
      .btn-liquid::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(255,255,255,0.3), transparent);
        opacity: 0;
        transition: opacity 0.3s;
      }
      
      .btn-liquid:hover::after {
        opacity: 1;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.2); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(139, 92, 246, 0.4); }

      /* Safe Areas */
      .pt-safe { padding-top: var(--sat); }
      .pb-safe { padding-bottom: var(--sab); }
      
      /* Card gloss effect */
      .card-gloss-overlay {
        background: linear-gradient(125deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 40%, rgba(255,255,255,0) 100%);
        pointer-events: none;
      }
    </style>
