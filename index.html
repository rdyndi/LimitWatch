<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>LimitWatch</title>

    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb', // blue-600
              secondary: '#64748b', // slate-500
              danger: '#ef4444', // red-500
              success: '#10b981', // emerald-500
              warning: '#f59e0b', // amber-500
            }
          }
        }
      }
    </script>

    <!-- Font Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      html, body {
        overscroll-behavior-y: none; /* Mencegah efek bounce */
        height: 100%;
        width: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent; /* Hilangkan highlight biru saat tap */
        -webkit-touch-callout: none; /* Hilangkan menu konteks saat tahan lama */
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        user-select: none; /* Mencegah seleksi teks UI */
        -webkit-user-select: none;
      }

      /* Re-enable text selection for inputs */
      input, textarea, [contenteditable="true"] {
        user-select: text;
        -webkit-user-select: text;
      }

      /* Safe Area Utilities for WebView/PWA */
      .pt-safe {
        padding-top: var(--sat);
      }
      .pb-safe {
        padding-bottom: var(--sab);
      }
      .pl-safe {
        padding-left: var(--sal);
      }
      .pr-safe {
        padding-right: var(--sar);
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      ::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      * {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
</head>

  <body class="bg-slate-50">
    <div id="root"></div>

    <!-- Entry React -->
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
