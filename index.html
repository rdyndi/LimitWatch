    <style>
      :root {
        --sat: env(safe-area-inset-top);
        --sab: env(safe-area-inset-bottom);
        --sal: env(safe-area-inset-left);
        --sar: env(safe-area-inset-right);
      }

      html, body {
        overscroll-behavior-y: none;
        height: 100%;
        width: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Liquid Aurora Background */
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0F0F1E;
        color: #1e293b;
      }

      /* Animated Mesh Background */
      .ambient-light {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -2;
        background: radial-gradient(circle at center, #f8fafc, #eef2ff);
        overflow: hidden;
      }
      
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.6;
        animation: float 20s infinite ease-in-out alternate;
        will-change: transform;
      }

      /* iOS 18 Style Gradients - Modified for Purple/Indigo Theme */
      .orb-1 {
        width: 80vw;
        height: 80vw;
        /* Changed from Blue to Indigo/Violet */
        background: radial-gradient(circle, rgba(99, 102, 241, 0.8) 0%, rgba(99, 102, 241, 0) 70%);
        top: -20%;
        left: -20%;
        animation-duration: 25s;
      }
      
      .orb-2 {
        width: 90vw;
        height: 90vw;
        background: radial-gradient(circle, rgba(244, 114, 182, 0.8) 0%, rgba(244, 114, 182, 0) 70%);
        bottom: -20%;
        right: -20%;
        animation-duration: 30s;
        animation-delay: -5s;
      }

      .orb-3 {
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, rgba(167, 139, 250, 0.8) 0%, rgba(167, 139, 250, 0) 70%);
        top: 40%;
        left: 30%;
        animation-duration: 20s;
        animation-delay: -10s;
      }

      .orb-4 {
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, rgba(52, 211, 153, 0.6) 0%, rgba(52, 211, 153, 0) 70%);
        bottom: 10%;
        left: 10%;
        animation-duration: 28s;
        animation-delay: -15s;
      }

      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg) scale(1); }
        33% { transform: translate(30px, -50px) rotate(10deg) scale(1.1); }
        66% { transform: translate(-20px, 20px) rotate(-5deg) scale(0.95); }
        100% { transform: translate(0, 0) rotate(0deg) scale(1); }
      }

      /* --- Liquid Glass Utilities --- */

      /* Base Glass Panel - Ultra premium */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
      }

      /* Darker/Heavy Glass (for Sidebars/Navs) */
      .glass-heavy {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(40px) saturate(200%);
        -webkit-backdrop-filter: blur(40px) saturate(200%);
        border-right: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 4px 0 24px rgba(0, 0, 0, 0.02);
      }
      
      /* Mobile Nav Glass */
      .glass-nav {
         background: rgba(255, 255, 255, 0.85);
         backdrop-filter: blur(30px) saturate(180%);
         -webkit-backdrop-filter: blur(30px) saturate(180%);
         border-top: 1px solid rgba(255, 255, 255, 0.6);
         box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
      }

      /* Input Fields Glass */
      .glass-input {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        color: #1e293b;
      }
      .glass-input:focus {
        background: rgba(255, 255, 255, 0.9);
        border-color: #6366f1; /* Indigo */
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); /* Indigo Glow */
        transform: translateY(-1px);
      }
      .glass-input::placeholder {
        color: rgba(100, 116, 139, 0.6);
      }

      /* Modal Overlay */
      .glass-overlay {
        background: rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      /* Buttons with liquid sheen - Updated for Purple/Indigo */
      .btn-liquid {
        background-image: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
        box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3), inset 0 1px 0 rgba(255,255,255,0.3);
        border: 1px solid rgba(255,255,255,0.1);
        position: relative;
        overflow: hidden;
      }
      
      .btn-liquid::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(rgba(255,255,255,0.2), transparent);
        opacity: 0;
        transition: opacity 0.3s;
      }
      
      .btn-liquid:hover::after {
        opacity: 1;
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

      /* Safe Areas */
      .pt-safe { padding-top: var(--sat); }
      .pb-safe { padding-bottom: var(--sab); }
      
      /* Card gloss effect */
      .card-gloss-overlay {
        background: linear-gradient(125deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0) 100%);
        pointer-events: none;
      }
    </style>
