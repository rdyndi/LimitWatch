<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>LimitWatch</title>

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- PWA Primary Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="LimitWatch" />
    <meta name="theme-color" content="#020617" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS PWA Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LimitWatch" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem('limitwatch_theme');
          var isDark = t === 'light' ? false : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#020617';
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#020617');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
            var meta = document.getElementById('theme-color-meta');
            if (meta) meta.setAttribute('content', '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Font Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-slate-50 dark:bg-slate-950">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
